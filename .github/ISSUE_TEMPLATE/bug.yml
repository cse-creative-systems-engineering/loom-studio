name: Bug report
description: Something does not work, or works differently on the canvas, in Preview and in the export.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Canvas, Preview, HTML export, React export, Properties panel, Assistant, Other]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Drop a DataGrid\n2. ..."
  - type: textarea
    id: shot
    attributes:
      label: Screenshot or exported file
      description: Drag a screenshot or the .loom / exported file here.
  - type: input
    id: env
    attributes:
      label: OS and Loom version (or commit)
